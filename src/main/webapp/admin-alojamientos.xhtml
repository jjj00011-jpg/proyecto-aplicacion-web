<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/plantilla.xhtml">
    <f:metadata>
        <f:viewAction action="#{adminGuardVM.checkAdmin}" onPostback="false"/>
    </f:metadata>
    <ui:define name="title">Admin · Alojamientos</ui:define>

    <ui:define name="content">
        <main class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 m-0">Alojamientos (Admin)</h1>

                <h:link styleClass="btn ruja-btn" outcome="admin-alojamiento-form" value="Nuevo alojamiento"/>
            </div>

            <div class="card shadow-sm">
                <div class="card-body table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Ciudad</th>
                            <th>Tipo</th>
                            <th>Precio/noche</th>
                            <th>Valoración</th>
                            <th>Capacidad</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <ui:repeat value="#{alojamientosVM.lista}" var="a">
                            <tr>
                                <td>#{a.idAlojamiento}</td>
                                <td>#{a.nombre}</td>
                                <td>#{a.ciudad}</td>
                                <td>#{a.tipo}</td>
                                <td>#{a.precioNoche}€</td>
                                <td>#{a.valoracionMedia}</td>
                                <td>#{a.capacidad}</td>

                                <td class="text-end">

                                    <h:link styleClass="btn btn-outline-secondary btn-sm"
                                            outcome="admin-alojamiento-form" value="Editar">
                                        <f:param name="id" value="#{a.idAlojamiento}" />
                                    </h:link>

                                    <h:form styleClass="d-inline">
                                        <h:commandButton value="Borrar"
                                                         styleClass="btn btn-outline-danger btn-sm"
                                                         action="#{alojamientosVM.borrar(a.idAlojamiento)}"
                                                         onclick="return confirm('¿Seguro que quieres borrar este alojamiento?');" />
                                    </h:form>
                                </td>
                            </tr>
                        </ui:repeat>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-3">
                <h:link styleClass="btn btn-outline-secondary" outcome="index" value="← Volver al inicio"/>
            </div>
        </main>
    </ui:define>

</ui:composition>
