<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:pt="jakarta.faces.passthrough"
                template="/WEB-INF/template/plantilla.xhtml">

    <ui:define name="title">ReservaUJA · Login</ui:define>

    <ui:define name="content">
        <main class="container my-4" style="max-width: 520px;">
            <div class="card shadow-sm">
                <div class="card-header fw-bold">Iniciar sesión</div>
                <div class="card-body">

                    <h:messages styleClass="alert alert-danger"
                                globalOnly="true"
                                layout="list"
                                rendered="#{facesContext.maximumSeverity != null}" />

                    <h:form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <h:inputText id="email"
                                         value="#{authVM.email}"
                                         styleClass="form-control"
                                         required="true"
                                         requiredMessage="Introduce el email."
                                         pt:placeholder="admin@reservauja.com"/>
                            <h:message for="email" styleClass="text-danger small"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <h:inputSecret id="password"
                                           value="#{authVM.password}"
                                           styleClass="form-control"
                                           required="true"
                                           requiredMessage="Introduce la contraseña."
                                           pt:placeholder="••••••••"/>
                            <h:message for="password" styleClass="text-danger small"/>
                        </div>

                        <h:commandButton value="Entrar"
                                         action="#{authVM.login}"
                                         styleClass="btn ruja-btn w-100"/>

                    </h:form>

                    <div class="alert alert-info mt-3 mb-0">
                        <strong>Acceso administrador:</strong><br/>
                        Email: admin@reservauja.com<br/>
                        Contraseña: admin1234
                    </div>

                    <div class="text-center mt-3">
                        <h:link styleClass="text-muted" outcome="index" value="Volver al inicio" />
                    </div>
                </div>
            </div>
        </main>
    </ui:define>

</ui:composition>
