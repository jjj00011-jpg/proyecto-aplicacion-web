<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/plantilla.xhtml">

    <ui:define name="title">Admin · Servicios</ui:define>

    <ui:define name="content">
        <main class="container my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 m-0">Servicios (Admin)</h1>
                <h:link styleClass="btn ruja-btn" outcome="admin-servicio-form" value="Nuevo servicio"/>
            </div>

            <div class="card shadow-sm">
                <div class="card-body table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>

                        <tbody>
                        <ui:repeat value="#{serviciosVM.lista}" var="s">
                            <tr>
                                <td>#{s.idServicio}</td>
                                <td>#{s.nombre}</td>
                                <td>#{s.descripcion}</td>

                                <td class="text-end">
                                    <h:link styleClass="btn btn-outline-secondary btn-sm"
                                            outcome="admin-servicio-form" value="Editar">
                                        <f:param name="id" value="#{s.idServicio}" />
                                    </h:link>

                                    <h:form styleClass="d-inline">
                                        <h:commandButton value="Borrar"
                                                         styleClass="btn btn-outline-danger btn-sm"
                                                         action="#{serviciosVM.borrar(s.idServicio)}"
                                                         onclick="return confirm('¿Seguro que quieres borrar este servicio?');" />
                                    </h:form>
                                </td>
                            </tr>
                        </ui:repeat>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-3">
                <h:link styleClass="btn btn-outline-secondary" outcome="index" value="← Volver al inicio"/>
            </div>
        </main>
    </ui:define>

</ui:composition>
