<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/template/plantilla.xhtml">

    <ui:define name="title">ReservaUJA · Inicio</ui:define>

    <ui:define name="top">
        <header class="ruja-header">
            <div class="container position-relative">
                <h1 class="text-center text-white ruja-brand display-4 m-0">ReservaUJA</h1>
                <p class="text-center text-white mb-0 ruja-hero-subtitle">
                    Alojamientos en Jaén y municipios destacados de la provincia
                </p>
                <h:link styleClass="btn ruja-btn ruja-login-btn" outcome="login" value="Login"/>
            </div>
        </header>
    </ui:define>

    <ui:define name="content">
        <main class="container my-4">
            <section class="card ruja-search-card shadow-sm">
                <div class="card-body p-4">

                    <form id="searchForm" class="row g-3" novalidate="novalidate">

                        <!-- DESTINO -->
                        <div class="col-12">
                            <div class="ruja-field">
                                <div class="d-flex align-items-center">
                                    <span class="ruja-pill">📍</span>
                                    <p class="label">Destino</p>
                                </div>

                                <div class="d-flex align-items-start gap-2" style="max-width: 520px; width: 100%;">
                                    <div class="w-100">
                                        <input id="destino"
                                               class="form-control"
                                               type="text"
                                               required="required"
                                               placeholder="Ej. Jaén"/>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <span class="text-muted mt-2">🔎</span>
                                </div>
                            </div>
                        </div>

                        <!-- FECHAS -->
                        <div class="col-12">
                            <div class="ruja-field">
                                <div class="d-flex align-items-center">
                                    <span class="ruja-pill">📅</span>
                                    <p class="label">Fechas</p>
                                </div>

                                <div class="d-flex align-items-start gap-2" style="max-width: 520px; width: 100%;">
                                    <div class="w-100">
                                        <input id="entrada"
                                               class="form-control"
                                               type="date"
                                               required="required"/>
                                        <div class="invalid-feedback"></div>
                                    </div>

                                    <div class="w-100">
                                        <input id="salida"
                                               class="form-control"
                                               type="date"
                                               required="required"/>
                                        <div class="invalid-feedback"></div>
                                    </div>

                                    <span class="text-muted mt-2">📆</span>
                                </div>
                            </div>
                        </div>

                        <!-- HUÉSPEDES -->
                        <div class="col-12">
                            <div class="ruja-field">
                                <div class="d-flex align-items-center">
                                    <span class="ruja-pill">👤</span>
                                    <p class="label">Huéspedes</p>
                                </div>

                                <div class="d-flex align-items-start gap-2" style="max-width: 220px; width: 100%;">
                                    <div class="w-100">
                                        <input id="huespedes"
                                               class="form-control"
                                               type="number"
                                               min="1"
                                               max="50"
                                               value="2"
                                               required="required"/>
                                        <div class="invalid-feedback"></div>
                                    </div>
                                    <span class="text-muted mt-2">➕</span>
                                </div>
                            </div>
                        </div>

                        <!-- BOTONES -->
                        <div class="col-12 d-flex gap-2 justify-content-center mt-2">
                            <button class="btn ruja-btn px-5" type="submit">Preparar búsqueda</button>
                            <button class="btn btn-outline-secondary px-4" type="button" id="clearBtn">Borrar</button>
                        </div>
                    </form>

                    <!-- RESUMEN -->
                    <div id="searchSummary" class="ruja-search-summary mt-4 d-none">
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                            <div>
                                <h2 class="h5 mb-2">Resumen de búsqueda</h2>
                                <div class="d-flex flex-wrap gap-2">
                <span class="ruja-summary-chip">
                    <strong>Destino:</strong> <span id="sDestino"></span>
                </span>
                                    <span class="ruja-summary-chip">
                    <strong>Entrada:</strong> <span id="sEntrada"></span>
                </span>
                                    <span class="ruja-summary-chip">
                    <strong>Salida:</strong> <span id="sSalida"></span>
                </span>
                                    <span class="ruja-summary-chip">
                    <strong>Huéspedes:</strong> <span id="sHuespedes"></span>
                </span>
                                </div>
                            </div>

                            <div>
                                <h:link styleClass="btn ruja-btn px-4" outcome="results" value="Ver resultados"/>
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <section class="mt-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                            <div>
                                <h2 class="h4 mb-1">Explora Jaén y su provincia</h2>
                                <p class="text-muted mb-0">
                                    Visualiza la zona principal de alojamientos disponibles en la provincia.
                                </p>
                            </div>
                        </div>

                        <div id="homeMap" class="ruja-map shadow-sm"></div>
                    </div>
                </div>
            </section>

            <section class="mt-4 ruja-footer-actions">
                <h:link styleClass="btn ruja-btn px-4" outcome="myreservations" value="Mis reservas"/>
                <h:link styleClass="btn ruja-btn px-4" outcome="results" value="Resultados"/>
            </section>
        </main>
    </ui:define>

    <ui:define name="scripts">
        <script src="#{request.contextPath}/assets/js/utils.js"></script>
        <script src="#{request.contextPath}/assets/js/search.js"></script>
        <script src="#{request.contextPath}/assets/js/home-map.js"></script>
    </ui:define>

</ui:composition>
