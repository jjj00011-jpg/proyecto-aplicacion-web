<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/plantilla.xhtml">
    <f:metadata>
        <f:viewAction action="#{adminGuardVM.checkAdmin}" onPostback="false"/>
    </f:metadata>
    <ui:define name="title">Admin · Servicio</ui:define>

    <ui:define name="content">

        <!-- Cargar el servicio si viene id (editar) -->
        <f:metadata>
            <f:viewParam name="id" value="#{servicioFormVM.id}" />
            <f:viewAction action="#{servicioFormVM.load}" />
        </f:metadata>

        <main class="container my-4" style="max-width: 760px;">
            <h1 class="h3 mb-3">Servicio (Admin)</h1>

            <h:messages styleClass="alert alert-danger" layout="list"
                        rendered="#{facesContext.maximumSeverity != null}" />

            <div class="card shadow-sm">
                <div class="card-body">

                    <h:form>

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <h:inputText id="nombre" value="#{servicioFormVM.model.nombre}"
                                         styleClass="form-control"
                                         required="true"
                                         requiredMessage="El nombre del servicio es obligatorio."/>
                            <h:message for="nombre" styleClass="text-danger small" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <h:inputTextarea id="descripcion" value="#{servicioFormVM.model.descripcion}"
                                             styleClass="form-control" rows="3"
                                             required="true"
                                             requiredMessage="La descripción es obligatoria."/>
                            <h:message for="descripcion" styleClass="text-danger small" />
                        </div>

                        <div class="d-flex gap-2">
                            <h:commandButton value="Guardar"
                                             action="#{servicioFormVM.guardar}"
                                             styleClass="btn ruja-btn w-100"/>
                            <h:link value="Cancelar" outcome="admin-servicios"
                                    styleClass="btn btn-outline-secondary w-100"/>
                        </div>

                    </h:form>

                </div>
            </div>
        </main>

    </ui:define>
</ui:composition>
