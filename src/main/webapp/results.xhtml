<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/template/plantilla.xhtml">

    <ui:define name="title">ReservaUJA · Resultados</ui:define>

    <ui:define name="content">
        <main class="container my-4">
            <h1 class="h3 mb-3">Resultados de búsqueda</h1>

            <div class="row g-4">
                <aside class="col-12 col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-header fw-bold">Filtros dinámicos</div>
                        <div class="card-body">

                            <div class="mb-3">
                                <label class="form-label" for="precioMax">
                                    Precio máximo: <span id="precioMaxValue">300€</span>
                                </label>
                                <input id="precioMax"
                                       type="range"
                                       class="form-range"
                                       min="30"
                                       max="300"
                                       value="300"/>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo</label>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           id="hotel"
                                           checked="checked"/>
                                    <label class="form-check-label" for="hotel">Hotel</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           id="apto"
                                           checked="checked"/>
                                    <label class="form-check-label" for="apto">Apartamento</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="valoracionMin">Valoración mínima</label>
                                <select id="valoracionMin" class="form-select">
                                    <option value="1">1+</option>
                                    <option value="2">2+</option>
                                    <option value="3">3+</option>
                                    <option value="4">4+</option>
                                    <option value="5">5</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button id="aplicarFiltros" class="btn ruja-btn" type="button">
                                    Aplicar filtros
                                </button>

                                <button id="limpiarFiltros" class="btn btn-outline-secondary" type="button">
                                    Limpiar filtros
                                </button>
                            </div>
                        </div>
                    </div>
                </aside>

                <section class="col-12 col-lg-8">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                        <div id="resultsCount" class="text-muted">Cargando alojamientos...</div>

                        <select id="ordenResultados" class="form-select" style="max-width: 220px;">
                            <option value="relevancia" selected="selected">Ordenar: Relevancia</option>
                            <option value="precio-asc">Precio: más bajo</option>
                            <option value="precio-desc">Precio: más alto</option>
                            <option value="valoracion-desc">Mejor valoración</option>
                        </select>
                    </div>

                    <div id="resultsLoading" class="alert alert-info">
                        Cargando alojamientos desde el servidor...
                    </div>

                    <div id="resultsError" class="alert alert-danger d-none"></div>

                    <div id="resultsEmpty" class="alert alert-warning d-none">
                        No hay alojamientos que coincidan con los filtros seleccionados.
                    </div>

                    <div id="resultsList"></div>

                    <h:link styleClass="btn btn-outline-secondary mt-3"
                            outcome="index.xhtml"
                            value="← Volver al inicio"/>
                </section>
            </div>
        </main>
    </ui:define>

    <ui:define name="scripts">
        <script src="#{request.contextPath}/assets/js/utils.js"></script>
        <script src="#{request.contextPath}/assets/js/results.js"></script>
    </ui:define>

</ui:composition>
